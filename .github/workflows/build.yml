name: Build and test Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse real documents in the repository
        shell: pwsh
        run: |
          # The reviewed synthetic example is the only document allowed in source control.
          $found = git ls-files -- '*.xfir' '*.XFIR' '*.pdf' '*.PDF' ':(exclude)esempio-sintetico.xfir'
          if ($found) { throw "Real documents must not be committed: $found" }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore locked dependencies
        run: dotnet restore xFirW.slnx --locked-mode -p:SecurityAuditRequired=true
      - name: Check audit failure policy and generated manifest
        shell: pwsh
        run: |
          ./scripts/Test-SecurityAudit.ps1
          ./scripts/Test-ManifestGeneration.ps1
      - name: Build
        run: dotnet build xFirW.slnx -c Release --no-restore -m:1
      - name: Test synthetic documents
        run: dotnet test tests/Xfir.Tests -c Release --no-build --no-restore --logger trx --results-directory artifacts/test-results
      - name: Check bundled runtime security
        shell: pwsh
        run: |
          dotnet publish src/Xfir.App -c Release -r win-x64 --self-contained true --no-restore -o artifacts/runtime-check
          if ($LASTEXITCODE -ne 0) { throw 'Self-contained publish failed.' }
          [xml]$props = Get-Content Directory.Build.props -Raw
          ./scripts/Assert-SecureRuntime.ps1 -Layout artifacts/runtime-check -MinimumVersion $props.Project.PropertyGroup.MinimumSecureRuntimeVersion
      - name: Publish prototype (requires .NET Desktop Runtime 10 and WebView2)
        run: dotnet publish src/Xfir.App -c Release --no-restore -o artifacts/xFirW
      - name: Refuse documents in the published output
        shell: pwsh
        run: |
          $found = Get-ChildItem artifacts/xFirW -Recurse -File | Where-Object { $_.Extension -in '.xfir', '.pdf' }
          if ($found) { throw "Documents must not be distributed: $($found.FullName)" }
      - uses: actions/upload-artifact@v4
        with:
          name: xFirW-windows-prototype
          path: artifacts/xFirW/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/test-results/
          if-no-files-found: ignore
